<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookings — Café Framji</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f0e6;
        }

        h1 {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background: #3d3d22;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Café Framji — Bookings</h1>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Date</th>
                <th>Time</th>
                <th>Guests</th>
                <th>Message</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

                {% for booking in bookings %}

    <tr>
        <td>{{ booking[0] }}</td>
        <td>{{ booking[1] }}</td>
        <td>{{ booking[2] }}</td>
        <td>{{ booking[3] }}</td>
        <td>{{ booking[4] }}</td>
        <td>{{ booking[5] }}</td>
        <td>{{ booking[6] }}</td>
        <td>{{ booking[7] }}</td>
        <td>
              <a href="{{ url_for('edit_booking', booking_id=booking[0]) }}">
        Edit
    </a>
    <form action="{{ url_for('delete_booking', booking_id=booking[0]) }}" method="POST"
          onsubmit="return confirm('Delete this booking?');">
        <button type="submit">Delete</button>
    </form>
</td>
    </tr>

    {% endfor %}

        </tbody>

    </table>

</body>
</html>

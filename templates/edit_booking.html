<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Booking — Café Framji</title>
</head>

<body>

    <h1>Edit Booking</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" value="{{ booking[1] }}" required>

        <br><br>

        <label>Phone</label>
        <input type="text" name="phone" value="{{ booking[2] }}" required>

        <br><br>

        <label>Date</label>
        <input type="date" name="date" value="{{ booking[3] }}" required>

        <br><br>

        <label>Time</label>
        <input type="time" name="time" value="{{ booking[4] }}" required>

        <br><br>

        <label>Guests</label>

        <select name="guests">

            <option value="1" {% if booking[5] == "1" %}selected{% endif %}>1</option>
            <option value="2" {% if booking[5] == "2" %}selected{% endif %}>2</option>
            <option value="3" {% if booking[5] == "3" %}selected{% endif %}>3</option>
            <option value="4" {% if booking[5] == "4" %}selected{% endif %}>4</option>
            <option value="5" {% if booking[5] == "5" %}selected{% endif %}>5</option>
            <option value="6" {% if booking[5] == "6" %}selected{% endif %}>6</option>
            <option value="7+" {% if booking[5] == "7+" %}selected{% endif %}>7+</option>

        </select>

        <br><br>

        <label>Message</label>

        <textarea name="message">{{ booking[6] }}</textarea>

        <br><br>

        <button type="submit">
            Update Booking
        </button>

    </form>

    <br>

    <a href="{{ url_for('admin_bookings') }}">
        ← Back to bookings
    </a>

</body>

</html>
